<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CampusCheck - Deep App Mirror</title>
    
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800;900&display=swap');
        
        body { 
            font-family: 'Geist', sans-serif; 
            background-color: #F9FAFB; 
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }
        
        .fade-in { animation: fadeIn 0.3s ease-out forwards; }
        .slide-up { animation: slideUp 0.4s ease-out forwards; }
        .pulse-border { animation: pulseBorder 2s infinite; }
        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes pulseBorder { 0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.4); } 70% { box-shadow: 0 0 0 10px rgba(34, 197, 94, 0); } 100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); } }
        
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body>

    <main id="root" class="flex-1 overflow-hidden relative"></main>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // ============================================================================
        // MOCK DATA
        // ============================================================================
        const INITIAL_DATA = {
            courses: [
                { id: 'c1', code: 'CSC 301', dept: 'CSC', level: '300', planned: 15, held: 12, maxScore: 10 },
                { id: 'c2', code: 'CSC 305', dept: 'CSC', level: '300', planned: 15, held: 10, maxScore: 10 }
            ],
            enrollments: [
                { courseId: 'c1', matric: 'CSC/2021/001', attended: 10, streak: 3 },
                { courseId: 'c2', matric: 'CSC/2021/001', attended: 6, streak: 0 },
                { courseId: 'c1', matric: 'CSC/2021/042', attended: 12, streak: 5 },
                { courseId: 'c1', matric: 'CSC/2021/015', attended: 8, streak: 0 }
            ],
            logs: [
                { id: 'l1', matric: 'CSC/2021/042', status: 'verified', time: '10:01', method: 'Biometric' },
                { id: 'l2', matric: 'CSC/2021/015', status: 'pending_override', time: '10:03', method: 'Raised Hand (GPS weak)' }
            ],
            feed: [
                { id: 'f1', title: 'Mid-Term Exam Venue Change', content: 'Please note that the CSC 301 mid-term will now hold in the Main Auditorium.', date: '2 hours ago', course: 'CSC 301' },
                { id: 'f2', title: 'Assignment Deadline Extended', content: 'The deadline for the DBMS assignment has been moved to Friday.', date: '1 day ago', course: 'CSC 305' }
            ],
            analyticsData: [
                { matric: 'CSC/2021/001', attended: 12 },
                { matric: 'CSC/2021/002', attended: 10 },
                { matric: 'CSC/2021/003', attended: 8 },
                { matric: 'CSC/2021/004', attended: 14 },
                { matric: 'CSC/2021/005', attended: 5 }
            ]
        };

        // ============================================================================
        // MAIN APP ROUTER
        // ============================================================================
        function App() {
            const [activeView, setActiveView] = useState('student'); 
            const [toast, setToast] = useState(null);

            const [isSessionActive, setIsSessionActive] = useState(true); // Default to true so we see the radar
            const [logs, setLogs] = useState(INITIAL_DATA.logs);
            const [studentHasCheckedIn, setStudentHasCheckedIn] = useState(false);
            const [enrollments, setEnrollments] = useState(INITIAL_DATA.enrollments);
            const [courses, setCourses] = useState(INITIAL_DATA.courses);

            const showToast = (msg, type = 'success') => {
                setToast({ msg, type });
                setTimeout(() => setToast(null), 3000);
            };

            useEffect(() => { lucide.createIcons(); }, [activeView, toast, isSessionActive, logs, studentHasCheckedIn, enrollments, courses]);

            return (
                <div className="w-full h-full flex flex-col bg-[#F9FAFB] max-w-md mx-auto border-x border-gray-200 shadow-2xl">
                    <header className="bg-white border-b border-gray-200 px-4 py-3 flex justify-between items-center z-50 shrink-0">
                        <div className="flex items-center gap-2">
                            <div className="bg-[#2563EB] p-1.5 rounded-lg text-white"><i data-lucide="shield-check" className="w-5 h-5"></i></div>
                            <h1 className="text-lg font-black tracking-tight text-gray-900">CampusCheck</h1>
                        </div>
                        
                        <div className="flex gap-1 bg-gray-100 p-1 rounded-xl text-xs font-bold">
                            <button onClick={() => setActiveView('student')} className={`px-3 py-1.5 rounded-lg transition-all ${activeView === 'student' ? 'bg-white text-gray-900 shadow-sm' : 'text-gray-500'}`}>Student</button>
                            <button onClick={() => setActiveView('lecturer')} className={`px-3 py-1.5 rounded-lg transition-all ${activeView === 'lecturer' ? 'bg-white text-gray-900 shadow-sm' : 'text-gray-500'}`}>Lecturer</button>
                        </div>
                    </header>

                    {toast && (
                        <div className={`fixed top-16 left-1/2 -translate-x-1/2 px-4 py-2.5 rounded-xl shadow-xl z-50 font-bold text-white slide-up text-sm w-[90%] max-w-sm text-center ${toast.type === 'error' ? 'bg-red-600' : 'bg-gray-900'}`}>
                            {toast.msg}
                        </div>
                    )}

                    <div className="flex-1 overflow-y-auto">
                        {activeView === 'student' && (
                            <StudentPortal 
                                isSessionActive={isSessionActive} logs={logs} setLogs={setLogs}
                                enrollments={enrollments} setEnrollments={setEnrollments}
                                studentHasCheckedIn={studentHasCheckedIn} setStudentHasCheckedIn={setStudentHasCheckedIn}
                                showToast={showToast}
                            />
                        )}
                        
                        {activeView === 'lecturer' && (
                            <LecturerDashboard 
                                isSessionActive={isSessionActive} setIsSessionActive={setIsSessionActive}
                                logs={logs} setLogs={setLogs} analyticsData={INITIAL_DATA.analyticsData}
                                courses={courses} setCourses={setCourses} enrollments={enrollments} setEnrollments={setEnrollments}
                                showToast={showToast}
                            />
                        )}
                    </div>
                </div>
            );
        }

        // ============================================================================
        // STUDENT PORTAL
        // ============================================================================
        function StudentPortal({ isSessionActive, logs, setLogs, enrollments, setEnrollments, studentHasCheckedIn, setStudentHasCheckedIn, showToast }) {
            const [isUnlocked, setIsUnlocked] = useState(false);
            const [activeTab, setActiveTab] = useState('dashboard'); 
            const [checkInState, setCheckInState] = useState('idle');
            const [isClassRep] = useState(true); 

            const handleUnlock = () => { setIsUnlocked(true); showToast("Biometric passkey verified"); };
            const handleCheckIn = () => setCheckInState('ready');
            
            const executeFinalCheckIn = () => {
                setCheckInState('locating');
                setTimeout(() => {
                    setCheckInState('verifying');
                    setTimeout(() => {
                        setCheckInState('success');
                        setStudentHasCheckedIn(true);
                        setLogs(prev => [{ id: 'l_'+Date.now(), matric: 'CSC/2021/001', status: 'verified', time: 'Just now', method: 'Biometric' }, ...prev]);
                        setEnrollments(prev => prev.map(e => e.courseId === 'c1' ? { ...e, attended: e.attended + 1, streak: e.streak + 1 } : e));
                    }, 2000);
                }, 2000);
            };

            const handleEnroll = (courseId, courseCode) => {
                if (enrollments.find(e => e.courseId === courseId)) return;
                setEnrollments(prev => [...prev, { courseId, matric: 'CSC/2021/001', attended: 0, streak: 0 }]);
                showToast(`Enrolled in ${courseCode}!`);
            };

            const getShieldColor = (pct) => {
                if (pct >= 70) return { bar: 'bg-emerald-500', text: 'text-emerald-700', bg: 'bg-emerald-50/50', border: 'border-emerald-200' };
                if (pct >= 50) return { bar: 'bg-amber-400', text: 'text-amber-700', bg: 'bg-amber-50/50', border: 'border-amber-200' };
                return { bar: 'bg-red-500', text: 'text-red-700', bg: 'bg-red-50/50', border: 'border-red-200' };
            };

            if (!isUnlocked) {
                return (
                    <div className="p-4 mt-8 slide-up">
                        <div className="text-center mb-6">
                            <div className="bg-[#2563EB] w-14 h-14 rounded-2xl flex items-center justify-center shadow-lg shadow-blue-500/30 mx-auto mb-4 relative overflow-hidden">
                                <i data-lucide="shield-check" className="w-7 h-7 text-white z-10"></i>
                                <div className="absolute top-0 left-0 w-full h-1/2 bg-white/10 rounded-t-2xl"></div>
                            </div>
                            <h1 className="text-2xl font-black text-gray-900 tracking-tight">Survival Companion</h1>
                        </div>
                        <div className="bg-white rounded-3xl shadow-xl border border-gray-200 p-6">
                            <input type="text" defaultValue="CSC/2021/001" disabled className="w-full bg-gray-50 border border-gray-200 text-gray-900 font-bold text-lg py-4 px-4 rounded-2xl outline-none uppercase mb-4" />
                            <button onClick={handleUnlock} className="w-full flex items-center justify-center gap-2 bg-[#2563EB] text-white font-bold text-lg py-4 rounded-2xl shadow-lg active:scale-95 transition-all">
                                <i data-lucide="lock" className="w-5 h-5"></i> Unlock Portal
                            </button>
                        </div>
                    </div>
                );
            }

            const tabs = [
                { id: 'dashboard', label: 'Status', icon: 'zap' },
                { id: 'records', label: 'Records', icon: 'file-text' },
                { id: 'register', label: 'Enroll', icon: 'plus' },
                { id: 'feed', label: 'Feed', icon: 'megaphone' }
            ];
            if (isClassRep) tabs.push({ id: 'rep', label: 'Rep Desk', icon: 'book-open' });

            return (
                <div className="slide-up pb-12">
                    <div className="text-center mb-6 pt-4 px-4 relative">
                        <div className="bg-[#2563EB] w-14 h-14 rounded-2xl flex items-center justify-center shadow-lg shadow-blue-500/30 mb-4 relative overflow-hidden mx-auto">
                            <i data-lucide="shield-check" className="w-7 h-7 text-white z-10"></i>
                        </div>
                        <h1 className="text-2xl font-black text-gray-900 tracking-tight">Hey, D-Boy!</h1>
                        <p className="text-gray-500 mt-1 font-medium text-sm">Track your NUC clearance status</p>
                    </div>

                    {isSessionActive && !studentHasCheckedIn && (
                        <div onClick={() => setActiveTab('checkin')} className="mx-4 mb-6 bg-green-600 text-white p-4 rounded-2xl shadow-lg flex items-center justify-between cursor-pointer pulse-border">
                            <div className="flex items-center gap-3">
                                <div className="bg-white/20 p-2 rounded-full"><i data-lucide="zap" className="w-5 h-5"></i></div>
                                <div>
                                    <p className="text-xs font-bold uppercase text-green-100">Live Class Now</p>
                                    <p className="font-extrabold text-lg">CSC 301</p>
                                </div>
                            </div>
                            <span className="text-sm font-black bg-white text-green-700 px-3 py-1.5 rounded-lg">Check In</span>
                        </div>
                    )}

                    <div className="px-4">
                        {activeTab !== 'checkin' && (
                            <div className="flex bg-gray-100 p-1 rounded-xl mb-6 gap-1 overflow-x-auto hide-scrollbar">
                                {tabs.map(t => (
                                    <button key={t.id} onClick={() => setActiveTab(t.id)} className={`flex-1 flex flex-col items-center justify-center py-2 rounded-lg text-[11px] font-bold transition-all whitespace-nowrap ${activeTab === t.id ? 'bg-white text-gray-900 shadow-sm' : 'text-gray-500'}`}>
                                        <i data-lucide={t.icon} className="w-4 h-4 mb-0.5"></i> {t.label}
                                    </button>
                                ))}
                            </div>
                        )}

                        <div className="bg-white rounded-3xl shadow-xl border border-gray-200 p-6 min-h-112">
                            {activeTab === 'dashboard' && (
                                <div className="space-y-5 fade-in">
                                    <div className="bg-blue-50 border border-blue-100 p-3 rounded-xl flex items-center justify-between">
                                        <div className="flex items-center gap-2">
                                            <span className="text-xs font-bold text-blue-800 uppercase">Profile:</span>
                                            <span className="text-base font-black text-blue-900">D-Boy</span>
                                        </div>
                                        <i data-lucide="edit-3" className="text-blue-500 w-4 h-4"></i>
                                    </div>

                                    {enrollments.map(e => {
                                        const course = INITIAL_DATA.courses.find(c => c.id === e.courseId);
                                        if (!course) return null;
                                        const pct = Math.round((e.attended / course.planned) * 100);
                                        const colors = getShieldColor(pct);

                                        return (
                                            <div key={e.courseId} className={`p-4 rounded-2xl border ${colors.bg} ${colors.border}`}>
                                                <div className="flex justify-between items-start mb-3">
                                                    <div>
                                                        <p className="font-black text-gray-900 text-lg">{course.code}</p>
                                                        <p className="text-xs text-gray-600 font-semibold">{e.attended} / {course.planned} Classes</p>
                                                    </div>
                                                    <p className={`font-black text-2xl ${colors.text}`}>{pct}%</p>
                                                </div>
                                                <div className="relative w-full h-3 bg-gray-200/50 rounded-full overflow-hidden">
                                                    <div className={`h-full ${colors.bar}`} style={{ width: `${Math.min(pct, 100)}%` }}></div>
                                                    <div className="absolute top-0 bottom-0 w-1 bg-gray-900/30" style={{ left: '70%' }}></div>
                                                </div>
                                                <div className="mt-2 flex justify-between text-[10px] font-bold text-gray-500 uppercase">
                                                    <span>{e.streak} Streak</span>
                                                    <span>{Math.max(0, Math.floor(course.planned * 0.3) - (course.planned - e.attended))} Safe Skips</span>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            )}

                            {activeTab === 'checkin' && (
                                <div className="fade-in">
                                    {checkInState === 'idle' && (
                                        <div className="space-y-5">
                                            <input type="text" defaultValue="CSC/2021/001" disabled className="w-full bg-gray-50 border border-gray-200 text-gray-900 font-bold py-4 px-4 rounded-xl outline-none uppercase" />
                                            <button onClick={handleCheckIn} disabled={!isSessionActive} className="w-full flex items-center justify-center gap-2 bg-[#2563EB] text-white font-bold text-lg py-4 rounded-xl shadow-md active:scale-[0.98] transition-all disabled:opacity-50">Continue <i data-lucide="arrow-right" className="w-5 h-5"></i></button>
                                        </div>
                                    )}
                                    {checkInState === 'ready' && (
                                        <div className="space-y-4 text-center">
                                            <i data-lucide="check-circle" className="text-green-600 w-12 h-12 mx-auto"></i>
                                            <h3 className="text-2xl font-extrabold text-gray-900">Identity Confirmed</h3>
                                            <p className="text-gray-900 font-black text-xl">CSC/2021/001</p>
                                            <button onClick={executeFinalCheckIn} className="w-full bg-gray-900 text-white font-bold py-4 rounded-xl shadow-md flex justify-center items-center gap-2"><i data-lucide="navigation" className="w-5 h-5"></i> Submit Attendance</button>
                                        </div>
                                    )}
                                    {(checkInState === 'locating' || checkInState === 'verifying') && (
                                        <div className="py-8 flex flex-col items-center">
                                            <i data-lucide="loader-2" className="w-10 h-10 text-[#2563EB] animate-spin mb-4"></i>
                                            <p className="text-gray-700 font-bold">{checkInState === 'locating' ? "Getting location..." : "Verifying coordinates..."}</p>
                                        </div>
                                    )}
                                    {checkInState === 'success' && (
                                        <div className="py-6 text-center">
                                            <i data-lucide="check-circle" className="w-20 h-20 text-green-500 mx-auto mb-4"></i>
                                            <h3 className="text-2xl font-bold text-gray-900">Verified!</h3>
                                            <button onClick={() => { setActiveTab('dashboard'); setCheckInState('idle'); }} className="w-full mt-6 bg-gray-900 text-white font-bold py-3.5 rounded-xl shadow-md">Return to Dashboard</button>
                                        </div>
                                    )}
                                </div>
                            )}

                            {activeTab === 'records' && (
                                <div className="space-y-3 fade-in">
                                    {logs.filter(l => l.matric === 'CSC/2021/001').map((log, i) => (
                                        <div key={i} className="bg-gray-50 p-4 rounded-xl border border-gray-200 flex justify-between items-center">
                                            <div><p className="font-bold text-gray-900 text-sm">CSC 301</p><p className="text-[10px] text-gray-500">{log.time}</p></div>
                                            <span className="bg-green-100 text-green-700 text-[10px] font-bold px-2 py-1 rounded-md uppercase">{log.status}</span>
                                        </div>
                                    ))}
                                </div>
                            )}

                            {activeTab === 'register' && (
                                <div className="fade-in space-y-3">
                                    <div className="bg-amber-50 border border-amber-200 rounded-xl p-3 flex items-start gap-2 mb-4">
                                        <i data-lucide="alert-triangle" className="text-amber-600 shrink-0 w-4 h-4 mt-0.5"></i>
                                        <p className="text-sm text-amber-800 font-medium">Enrolling here only links you to your lecturer's attendance roster.</p>
                                    </div>
                                    <div className="bg-gray-50 border border-gray-200 p-4 rounded-xl flex justify-between items-center">
                                        <p className="font-bold text-gray-900 text-sm">CSC 401</p>
                                        <button onClick={() => handleEnroll('c3', 'CSC 401')} className="bg-[#2563EB] text-white px-4 py-2 rounded-lg font-bold text-sm">Enroll</button>
                                    </div>
                                </div>
                            )}

                            {activeTab === 'rep' && isClassRep && (
                                <div className="fade-in space-y-4">
                                    <div className="bg-amber-50 border border-amber-200 p-4 rounded-xl">
                                        <h3 className="font-bold text-amber-900 text-base mb-2">Log Dead Battery</h3>
                                        <p className="text-sm text-amber-700 mb-3">Limit: 3 per class.</p>
                                        <div className="flex gap-2">
                                            <input type="text" placeholder="Matric No." className="w-full bg-white border border-amber-200 p-3 rounded-lg text-sm font-bold uppercase" />
                                            <button onClick={() => showToast("Logged!")} className="bg-amber-500 text-white px-5 py-3 rounded-lg font-bold text-sm">Log</button>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {activeTab === 'feed' && (
                                <div className="space-y-4 fade-in">
                                    {INITIAL_DATA.feed.map(post => (
                                        <div key={post.id} className="bg-gray-50 border border-gray-200 p-4 rounded-xl">
                                            <h4 className="font-extrabold text-gray-900 text-sm">{post.title}</h4>
                                            <p className="text-sm text-gray-600 mt-1">{post.content}</p>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        // ============================================================================
        // LECTURER DASHBOARD (Deeply Detailed)
        // ============================================================================
        function LecturerDashboard({ isSessionActive, setIsSessionActive, logs, setLogs, analyticsData, courses, setCourses, enrollments, setEnrollments, showToast }) {
            const [activeTab, setActiveTab] = useState('radar'); // radar, analytics, manage
            const [ledgerTab, setLedgerTab] = useState('verified');
            const [manualMatric, setManualMatric] = useState('');
            const [showAdvanced, setShowAdvanced] = useState(false);
            
            // Course Management
            const [newCourseCode, setNewCourseCode] = useState('');
            const [newDept, setNewDept] = useState('CSC');
            const [newLevel, setNewLevel] = useState('300');
            const [plannedClasses, setPlannedClasses] = useState(15);
            const [maxScore, setMaxScore] = useState(10);
            const [singleMatric, setSingleMatric] = useState('');
            const [repMatricInput, setRepMatricInput] = useState('');
            
            // Diagnostics & Wipe
            const [auditMatric, setAuditMatric] = useState('');
            const [auditRecords, setAuditRecords] = useState(null);
            const [wipeMatric, setWipeMatric] = useState('');

            // Modal
            const [editingCourse, setEditingCourse] = useState(null);
            const [modalStudents, setModalStudents] = useState([]);

            const handleEndSession = () => { setIsSessionActive(false); showToast("Session ended."); };
            const startSession = () => { setIsSessionActive(true); showToast("Session started!"); };
            const approveLog = (id) => { setLogs(prev => prev.map(l => l.id === id ? { ...l, status: 'verified', method: 'Manual Override' } : l)); showToast("Verified."); };
            
            const handleForceCheckIn = () => {
                if (!manualMatric.trim()) return;
                setLogs(prev => [{ id: 'l_'+Date.now(), matric: manualMatric.toUpperCase(), status: 'verified', time: 'Now', method: 'Manual' }, ...prev]);
                setManualMatric('');
                showToast("Force Checked-In.");
            };

            const handleCreateCourse = () => {
                if (!newCourseCode.trim()) return;
                setCourses([...courses, { id: 'c_'+Date.now(), code: newCourseCode.toUpperCase(), dept: newDept, level: newLevel, planned: Number(plannedClasses), held: 0, maxScore: Number(maxScore) }]);
                showToast(`Created ${newCourseCode}.`);
                setNewCourseCode('');
            };

            const handleAudit = () => {
                if (!auditMatric.trim()) return;
                setAuditRecords([{ date: 'Oct 12, 2026', status: 'verified' }, { date: 'Oct 05, 2026', status: 'absent' }]);
            };

            const openManageModal = (course) => {
                setEditingCourse(course);
                setModalStudents(['CSC/2021/042', 'CSC/2021/015']);
            };

            const verifiedLogs = logs.filter(l => l.status === 'verified');
            const flaggedLogs = logs.filter(l => l.status !== 'verified');

            const totalClassesHeld = 15;
            const atRiskStudents = analyticsData.filter(d => (d.attended/totalClassesHeld)*100 < 70);

            return (
                <div className="slide-up pb-12">
                    
                    {/* Navigation */}
                    <div className="flex bg-white p-2 border-b border-gray-200 sticky top-0 z-40">
                        <button onClick={() => setActiveTab('radar')} className={`flex-1 py-2 rounded-xl text-xs font-bold transition-all ${activeTab === 'radar' ? 'bg-[#2563EB] text-white shadow-md' : 'text-gray-500'}`}>Radar</button>
                        <button onClick={() => setActiveTab('analytics')} className={`flex-1 py-2 rounded-xl text-xs font-bold transition-all ${activeTab === 'analytics' ? 'bg-[#2563EB] text-white shadow-md' : 'text-gray-500'}`}>Analytics</button>
                        <button onClick={() => setActiveTab('manage')} className={`flex-1 py-2 rounded-xl text-xs font-bold transition-all ${activeTab === 'manage' ? 'bg-[#2563EB] text-white shadow-md' : 'text-gray-500'}`}>Manage</button>
                    </div>

                    <div className="p-4 space-y-6">
                        
                        {/* RADAR TAB (Deeply Detailed) */}
                        {activeTab === 'radar' && (
                            <div className="fade-in space-y-6">
                                {!isSessionActive ? (
                                    <div className="bg-white rounded-3xl shadow-sm border border-gray-100 p-6 text-center">
                                        <div className="bg-[#2563EB] text-white w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-4 shadow-lg shadow-blue-500/30">
                                            <i data-lucide="user" className="w-10 h-10"></i>
                                        </div>
                                        <h2 className="text-2xl font-extrabold text-gray-900 tracking-tight">Ready to start?</h2>
                                        
                                        <div className="relative mb-4 mt-6">
                                            <select className="w-full bg-gray-50 border border-gray-200 text-gray-900 font-bold text-xl py-4 pl-4 pr-10 rounded-2xl outline-none focus:ring-2 focus:ring-[#2563EB] transition-all appearance-none cursor-pointer">
                                                {courses.map(c => <option key={c.id}>{c.code}</option>)}
                                            </select>
                                            <div className="absolute inset-y-0 right-0 flex items-center pr-4 pointer-events-none text-gray-500">
                                                <i data-lucide="chevron-down" className="w-6 h-6" stroke-width="2.5"></i>
                                            </div>
                                        </div>

                                        <div className="space-y-3 mt-4 text-left">
                                            <div className="flex items-center bg-gray-50 border border-gray-200 rounded-xl overflow-hidden">
                                                <div className="pl-4 pr-3 flex items-center justify-center text-gray-400"><i data-lucide="timer" className="w-5 h-5"></i></div>
                                                <select className="w-full bg-transparent text-gray-900 font-bold py-4 pr-4 outline-none appearance-none cursor-pointer">
                                                    <option>Duration: 1 Hour (Standard)</option>
                                                    <option>Duration: 2 Hours</option>
                                                </select>
                                            </div>
                                            <button onClick={startSession} className="w-full flex items-center justify-center gap-2 bg-[#2563EB] text-white font-bold text-lg py-4 rounded-2xl shadow-md active:scale-[0.98] transition-all mt-2">
                                                <i data-lucide="map-pin" className="w-5 h-5"></i> Establish Geofence
                                            </button>
                                        </div>
                                    </div>
                                ) : (
                                    <>
                                        {/* Live Header */}
                                        <div className="bg-white rounded-2xl shadow-sm border border-gray-200 p-5">
                                            <div className="flex flex-col md:flex-row md:items-start justify-between gap-4">
                                                <div>
                                                    <div className="flex items-center gap-2 mb-1">
                                                        <i data-lucide="shield-check" className="text-[#2563EB] w-5 h-5"></i>
                                                        <span className="text-sm font-bold text-[#2563EB] uppercase tracking-wider">Dr. Turing</span>
                                                    </div>
                                                    <h1 className="text-2xl font-extrabold text-gray-900">Live Attendance</h1>
                                                    <div className="flex items-center gap-2 mt-2 flex-wrap">
                                                        <span className="w-2.5 h-2.5 rounded-full bg-green-500 animate-pulse"></span>
                                                        <span className="text-gray-500 font-bold text-lg">CSC 301</span>
                                                        <span className="flex items-center gap-1 text-xs font-bold text-blue-600 bg-blue-50 px-2 py-1 rounded-md border border-blue-200 ml-1">
                                                            <i data-lucide="wifi" className="w-3 h-3"></i> Live Sync
                                                        </span>
                                                        <span className="flex items-center gap-1 text-xs font-bold text-gray-600 bg-gray-50 px-2 py-1 rounded-md border border-gray-200 ml-1">
                                                            <i data-lucide="map-pin" className="w-3 h-3"></i> Anchor: set (±12m)
                                                        </span>
                                                    </div>
                                                </div>
                                                
                                                <div className="flex items-center justify-between bg-gray-50 p-3 rounded-xl border border-gray-100 gap-4 mt-2 md:mt-0">
                                                    <div>
                                                        <p className="text-2xl font-extrabold text-gray-900">{logs.length}</p>
                                                        <p className="text-[10px] text-gray-500 font-bold uppercase tracking-wider">Total Check-ins</p>
                                                    </div>
                                                    <button onClick={() => showToast("Exported CSV")} className="bg-green-600 text-white px-4 py-2.5 rounded-lg font-bold text-sm hover:bg-green-700 flex items-center gap-2 shadow-sm">
                                                        <i data-lucide="download" className="w-4 h-4"></i> Export
                                                    </button>
                                                </div>
                                            </div>
                                            
                                            <div className="grid grid-cols-2 gap-2 mt-4 pt-4 border-t border-gray-100">
                                                <button onClick={() => showToast("Link copied to clipboard!")} className="flex justify-center items-center gap-2 text-xs font-bold bg-white text-gray-700 px-3 py-2.5 rounded-xl border border-gray-200 shadow-sm hover:bg-gray-50 active:scale-[0.98]">
                                                    <i data-lucide="copy" className="w-4 h-4"></i> Share Link
                                                </button>
                                                <button onClick={() => showToast("Updating geofence...")} className="flex justify-center items-center gap-2 text-xs font-bold bg-blue-50 text-blue-700 px-3 py-2.5 rounded-xl border border-blue-200 shadow-sm hover:bg-blue-100 active:scale-[0.98]">
                                                    <i data-lucide="navigation" className="w-4 h-4"></i> Update GPS
                                                </button>
                                                <button onClick={handleEndSession} className="col-span-2 flex justify-center items-center gap-2 text-xs font-bold bg-red-50 text-red-600 px-3 py-2.5 rounded-xl border border-red-200 shadow-sm hover:bg-red-100 active:scale-[0.98]">
                                                    <i data-lucide="x-circle" className="w-4 h-4"></i> End Lecture
                                                </button>
                                            </div>
                                        </div>

                                        {/* Force Check-In */}
                                        <div className="bg-white p-5 rounded-2xl shadow-sm border border-gray-200">
                                            <h3 className="text-xs font-bold text-gray-700 mb-3 flex items-center gap-2"><i data-lucide="user-plus" className="text-[#2563EB] w-4 h-4"></i> Force Check-In</h3>
                                            <div className="flex flex-col gap-2">
                                                <input type="text" placeholder="Matric Number" value={manualMatric} onChange={(e) => setManualMatric(e.target.value.toUpperCase())} className="w-full bg-gray-50 border border-gray-200 p-3 rounded-xl outline-none font-bold focus:border-[#2563EB] focus:ring-2 focus:ring-[#2563EB] transition-all placeholder:text-gray-400 placeholder:font-medium uppercase text-sm" />
                                                <div className="flex gap-2">
                                                    <button onClick={handleForceCheckIn} disabled={!manualMatric.trim()} className="flex-1 bg-gray-900 text-white px-4 py-2.5 rounded-xl font-bold text-xs hover:bg-gray-800 disabled:opacity-50 transition-all flex justify-center items-center gap-2 shadow-md">
                                                        <i data-lucide="shield-check" className="w-3.5 h-3.5"></i> Force Check-In
                                                    </button>
                                                    <button onClick={() => { if(manualMatric) { showToast("Device wiped"); setManualMatric(''); } }} disabled={!manualMatric.trim()} className="flex-1 bg-red-50 text-red-600 px-4 py-2.5 rounded-xl font-bold text-xs border border-red-200 hover:bg-red-100 disabled:opacity-50 transition-all flex justify-center items-center gap-2">
                                                        <i data-lucide="trash-2" className="w-3.5 h-3.5"></i> Wipe
                                                    </button>
                                                </div>
                                            </div>
                                        </div>

                                        {/* Ledger */}
                                        <div className="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
                                            <div className="flex border-b border-gray-100">
                                                <button onClick={() => setLedgerTab('verified')} className={`flex-1 py-3 text-xs font-bold flex items-center justify-center gap-1 transition-colors ${ledgerTab === 'verified' ? 'bg-green-50/50 text-green-700 border-b-2 border-green-500' : 'text-gray-500 hover:bg-gray-50'}`}>
                                                    <i data-lucide="check-circle" className="w-3.5 h-3.5"></i> Verified ({verifiedLogs.length})
                                                </button>
                                                <button onClick={() => setLedgerTab('flagged')} className={`flex-1 py-3 text-xs font-bold flex items-center justify-center gap-1 transition-colors ${ledgerTab === 'flagged' ? 'bg-red-50/50 text-red-700 border-b-2 border-red-500' : 'text-gray-500 hover:bg-gray-50'}`}>
                                                    <i data-lucide="alert-triangle" className="w-3.5 h-3.5"></i> Review ({flaggedLogs.length})
                                                </button>
                                            </div>

                                            {ledgerTab === 'verified' ? (
                                                <div className="divide-y divide-gray-100 max-h-64 overflow-y-auto">
                                                    {verifiedLogs.length === 0 ? (
                                                        <p className="p-6 text-center text-gray-400 text-xs font-bold">No verified check-ins yet.</p>
                                                    ) : verifiedLogs.map(l => (
                                                        <div key={l.id} className="p-3 flex justify-between items-center">
                                                            <div>
                                                                <p className="font-bold text-gray-900 text-sm">{l.matric}</p>
                                                                {l.matric === 'CSC/2021/001' && <span className="text-[10px] text-gray-400 font-semibold">(D-Boy)</span>}
                                                            </div>
                                                            <div className="text-right">
                                                                <span className="inline-flex items-center gap-1 px-2 py-1 rounded text-[10px] font-bold bg-green-50 text-green-700 border border-green-200">
                                                                    <i data-lucide={l.method === 'Biometric' ? 'fingerprint' : 'map-pin'} className="w-3 h-3"></i> {l.method}
                                                                </span>
                                                                <p className="text-[9px] text-gray-400 font-bold mt-1 flex items-center justify-end gap-1"><i data-lucide="clock" className="w-3 h-3"></i> {l.time}</p>
                                                            </div>
                                                        </div>
                                                    ))}
                                                </div>
                                            ) : (
                                                <div className="divide-y divide-gray-100 p-3">
                                                    {flaggedLogs.length === 0 ? (
                                                        <p className="text-center py-6 text-gray-400 text-xs font-bold">No students require review.</p>
                                                    ) : flaggedLogs.map(l => (
                                                        <div key={l.id} className="p-3 flex flex-col gap-2 bg-red-50/30 rounded-xl mb-2 border border-red-100">
                                                            <div className="flex justify-between items-start">
                                                                <div>
                                                                    <p className="font-bold text-gray-900 text-sm">{l.matric}</p>
                                                                    <div className="flex items-center gap-2 mt-1">
                                                                        <span className="text-[9px] uppercase font-bold text-red-700 bg-red-100 px-1.5 py-0.5 rounded flex items-center gap-1">
                                                                            <i data-lucide="hand" className="w-3 h-3"></i> Raised Hand
                                                                        </span>
                                                                        <span className="text-[10px] text-gray-500 font-medium flex items-center gap-1">
                                                                            <i data-lucide="clock" className="w-3 h-3"></i> {l.time}
                                                                        </span>
                                                                    </div>
                                                                </div>
                                                            </div>
                                                            <p className="text-[10px] text-gray-600 font-medium">
                                                                <strong>Reason:</strong> {l.method}
                                                            </p>
                                                            <button onClick={() => approveLog(l.id)} className="bg-white border border-red-200 text-red-700 px-3 py-2 rounded-lg font-bold text-xs shadow-sm hover:bg-red-50 active:scale-[0.98] flex items-center justify-center gap-1">
                                                                <i data-lucide="shield-check" className="w-3.5 h-3.5"></i> Approve
                                                            </button>
                                                        </div>
                                                    ))}
                                                </div>
                                            )}
                                        </div>
                                    </>
                                )}
                            </div>
                        )}

                        {/* ANALYTICS TAB */}
                        {activeTab === 'analytics' && (
                            <div className="fade-in space-y-4">
                                <div className="bg-white p-5 rounded-2xl shadow-sm border border-gray-200">
                                    <h1 className="text-lg font-extrabold text-gray-900 mb-1">Semester Gradebook</h1>
                                    <p className="text-xs text-gray-500 font-bold mb-4">12 Classes Held</p>
                                    <div className="bg-blue-50 border border-blue-200 p-3 rounded-xl mb-4 flex justify-between items-center">
                                        <p className="text-xs font-bold text-blue-900">Lock Final Grades</p>
                                        <input type="checkbox" className="w-4 h-4 accent-blue-600" onChange={(e) => { if(e.target.checked) showToast("Locked!"); }} />
                                    </div>
                                    <button onClick={() => showToast("Downloading CSV...")} className="w-full bg-green-600 text-white font-bold py-3 rounded-xl text-sm shadow-sm mb-4">Download CSV</button>
                                    
                                    <button onClick={() => setShowAdvanced(!showAdvanced)} className="w-full flex justify-between items-center text-xs font-bold text-gray-500 bg-gray-50 p-3 rounded-xl border border-gray-200">
                                        <span>Custom Date Range</span>
                                        <i data-lucide={showAdvanced ? "chevron-up" : "chevron-down"} className="w-4 h-4"></i>
                                    </button>
                                    {showAdvanced && (
                                        <div className="mt-3 space-y-2">
                                            <input type="date" className="w-full bg-gray-50 border border-gray-200 p-2 rounded-lg text-xs font-bold" />
                                            <button className="w-full bg-gray-900 text-white py-2 rounded-lg text-xs font-bold">Export Range</button>
                                        </div>
                                    )}
                                </div>

                                <div className="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
                                    <div className="p-4 border-b border-gray-100">
                                        <h3 className="font-extrabold text-gray-900 text-sm">Watchlist ({atRiskStudents.length})</h3>
                                    </div>
                                    <div className="divide-y divide-gray-50 max-h-64 overflow-y-auto">
                                        {atRiskStudents.map((s, i) => (
                                            <div key={i} className="p-3 flex justify-between items-center">
                                                <div>
                                                    <p className="font-bold text-gray-900 text-xs">{s.matric}</p>
                                                    <p className="text-[10px] text-gray-500">{s.attended}/15 Classes</p>
                                                </div>
                                                <span className="bg-red-100 text-red-700 text-[10px] font-black px-2 py-1 rounded">{Math.round((s.attended/15)*100)}%</span>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* MANAGE TAB */}
                        {activeTab === 'manage' && (
                            <div className="fade-in space-y-4">
                                <div className="bg-white p-5 rounded-2xl shadow-sm border border-gray-200 space-y-4">
                                    <h2 className="text-sm font-bold text-gray-900 border-b border-gray-100 pb-2">Establish New Course</h2>
                                    <div>
                                        <label className="block text-[10px] font-bold text-gray-500 uppercase mb-1">Course Code</label>
                                        <input type="text" placeholder="e.g. CSC 301" value={newCourseCode} onChange={(e) => setNewCourseCode(e.target.value)} className="w-full bg-gray-50 border border-gray-200 p-3 rounded-xl outline-none font-bold text-sm uppercase" />
                                    </div>
                                    <div className="grid grid-cols-2 gap-3">
                                        <div>
                                            <label className="block text-[10px] font-bold text-gray-500 uppercase mb-1">Dept</label>
                                            <select className="w-full bg-gray-50 border border-gray-200 p-3 rounded-xl outline-none font-bold text-sm"><option>CSC</option></select>
                                        </div>
                                        <div>
                                            <label className="block text-[10px] font-bold text-gray-500 uppercase mb-1">Level</label>
                                            <select className="w-full bg-gray-50 border border-gray-200 p-3 rounded-xl outline-none font-bold text-sm"><option>300</option></select>
                                        </div>
                                    </div>
                                    <button onClick={handleCreateCourse} className="w-full bg-[#2563EB] text-white py-3 rounded-xl font-bold text-sm shadow-sm">Create Course</button>
                                </div>

                                <div className="bg-white p-5 rounded-2xl shadow-sm border border-gray-200 space-y-4">
                                    <h2 className="text-sm font-bold text-gray-900 border-b border-gray-100 pb-2">Quick Actions</h2>
                                    <div>
                                        <label className="block text-[10px] font-bold text-gray-500 uppercase mb-1">Add Single Student</label>
                                        <div className="flex gap-2">
                                            <input type="text" placeholder="Matric" value={singleMatric} onChange={(e) => setSingleMatric(e.target.value)} className="w-full bg-gray-50 border border-gray-200 p-3 rounded-xl outline-none font-bold text-xs uppercase" />
                                            <button onClick={() => { if(singleMatric) { showToast("Added!"); setSingleMatric(''); } }} className="bg-gray-900 text-white px-4 rounded-xl"><i data-lucide="user-plus" className="w-4 h-4"></i></button>
                                        </div>
                                    </div>
                                    <div>
                                        <label className="block text-[10px] font-bold text-amber-600 uppercase mb-1">Designate Class Rep</label>
                                        <div className="flex gap-2">
                                            <input type="text" placeholder="Rep Matric" value={repMatricInput} onChange={(e) => setRepMatricInput(e.target.value)} className="w-full bg-amber-50 border border-amber-200 p-3 rounded-xl outline-none font-bold text-xs text-amber-900 uppercase" />
                                            <button onClick={() => { if(repMatricInput) { showToast("Rep set!"); setRepMatricInput(''); } }} className="bg-amber-500 text-white px-4 rounded-xl"><i data-lucide="star" className="w-4 h-4"></i></button>
                                        </div>
                                    </div>
                                </div>

                                <div className="space-y-3">
                                    {courses.map(c => (
                                        <div key={c.id} className="bg-white p-4 rounded-xl border border-gray-200 shadow-sm flex flex-col gap-3">
                                            <div className="flex justify-between items-start">
                                                <div>
                                                    <h4 className="font-extrabold text-gray-900 text-base">{c.code}</h4>
                                                    <p className="text-[10px] font-bold text-gray-500 uppercase">{c.dept} • {c.level}L</p>
                                                </div>
                                            </div>
                                            <div className="flex gap-2">
                                                <button onClick={() => openManageModal(c)} className="flex-1 bg-gray-50 border border-gray-200 text-gray-700 py-2 rounded-lg font-bold text-xs">Manage</button>
                                                <button className="flex-1 bg-blue-50 border border-blue-200 text-blue-700 py-2 rounded-lg font-bold text-xs">Upload CSV</button>
                                            </div>
                                        </div>
                                    ))}
                                </div>

                                <div className="bg-white p-5 rounded-2xl shadow-sm border border-gray-200 space-y-4">
                                    <h2 className="text-sm font-bold text-gray-900 border-b border-gray-100 pb-2">Diagnostics & Wipe</h2>
                                    <div className="space-y-2">
                                        <input type="text" placeholder="Search Matric" value={auditMatric} onChange={(e) => setAuditMatric(e.target.value)} className="w-full bg-gray-50 border border-gray-200 p-3 rounded-xl outline-none font-bold text-xs uppercase" />
                                        <button onClick={handleAudit} className="w-full bg-gray-900 text-white py-2 rounded-lg text-xs font-bold">View Record</button>
                                    </div>

                                    {auditRecords && (
                                        <div className="bg-gray-50 rounded-xl p-3 space-y-2">
                                            {auditRecords.map((r, i) => (
                                                <div key={i} className="bg-white p-2 rounded-lg flex justify-between items-center border border-gray-100">
                                                    <p className="font-bold text-gray-900 text-xs">{r.date}</p>
                                                    <button onClick={() => showToast("Waiver granted")} className="bg-orange-100 text-orange-700 px-2 py-1 rounded text-[10px] font-bold">Waive</button>
                                                </div>
                                            ))}
                                        </div>
                                    )}

                                    <div className="pt-4 border-t border-gray-100">
                                        <label className="block text-[10px] font-bold text-red-500 uppercase mb-1">Wipe Device Lock</label>
                                        <div className="flex gap-2">
                                            <input type="text" placeholder="Matric" value={wipeMatric} onChange={(e) => setWipeMatric(e.target.value)} className="w-full bg-red-50 border border-red-100 p-3 rounded-xl outline-none font-bold text-xs text-red-900 uppercase" />
                                            <button onClick={() => { if(wipeMatric) { showToast("Device Wiped"); setWipeMatric(''); } }} className="bg-red-50 text-red-600 px-4 rounded-xl border border-red-200"><i data-lucide="trash-2" className="w-4 h-4"></i></button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>

                    {/* MANAGE MODAL */}
                    {editingCourse && (
                        <div className="fixed inset-0 bg-gray-900/60 z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-3xl shadow-2xl border border-gray-100 w-full max-w-md max-h-[90vh] flex flex-col animate-in zoom-in-95">
                                <div className="p-4 border-b border-gray-100 flex justify-between items-center bg-gray-50/50 rounded-t-3xl">
                                    <div>
                                        <h2 className="text-lg font-black text-gray-900">{editingCourse.code}</h2>
                                        <p className="text-[10px] font-bold text-gray-500 uppercase">{editingCourse.dept} • {editingCourse.level}L</p>
                                    </div>
                                    <button onClick={() => setEditingCourse(null)} className="p-2 bg-white rounded-full text-gray-400 shadow-sm border border-gray-200"><i data-lucide="x" className="w-4 h-4"></i></button>
                                </div>
                                <div className="p-4 overflow-y-auto space-y-4 flex-1">
                                    <h3 className="text-xs font-bold text-gray-800 border-b border-gray-100 pb-2">Enrolled Students</h3>
                                    <div className="max-h-60 overflow-y-auto border border-gray-100 rounded-xl divide-y divide-gray-50">
                                        {modalStudents.map(matric => (
                                            <div key={matric} className="p-3 flex justify-between items-center hover:bg-gray-50">
                                                <span className="font-bold text-gray-800 text-xs">{matric}</span>
                                                <button className="text-red-400 p-1 hover:bg-red-50 rounded"><i data-lucide="trash-2" className="w-3 h-3"></i></button>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                </div>
            );
        }

        // ============================================================================
        // RENDER APP
        // ============================================================================
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
